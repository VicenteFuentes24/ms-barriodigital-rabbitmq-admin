# Future deployment template ONLY. No published host ports, no broker deployment.
name: barriodigital-rabbitmq-admin-internal
services:
  rabbitmq-admin:
    image: ${RABBITMQ_ADMIN_IMAGE:?Set a versioned image or digest}
    environment:
      SERVER_PORT: 8088
      SERVER_ADDRESS: 0.0.0.0
      RABBITMQ_ADDRESSES: ${RABBITMQ_ADDRESSES:?Set the two internal host:port addresses}
      RABBITMQ_SSL_ENABLED: ${RABBITMQ_SSL_ENABLED:-true}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Set broker service account}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set external secret}
      RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VIRTUAL_HOST:-barriodigital}
      ADMIN_HTTP_USERNAME: ${ADMIN_HTTP_USERNAME:?Set internal HTTP account}
      ADMIN_HTTP_PASSWORD: ${ADMIN_HTTP_PASSWORD:?Set external secret}
    expose: [8088]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [barriodigital-net]
networks:
  barriodigital-net:
    external: true
    name: ${BARRIODIGITAL_NETWORK_NAME:-infra-barriodigital_barriodigital-net}
