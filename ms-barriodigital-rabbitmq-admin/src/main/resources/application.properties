spring.application.name=ms-barriodigital-rabbitmq-admin
server.port=${SERVER_PORT:8088}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
# Optional comma-separated host:port list for a future cluster; same vhost on both nodes.
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:}
spring.rabbitmq.username=${RABBITMQ_USERNAME:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:barriodigital}
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.requested-heartbeat=30s
spring.rabbitmq.channel-rpc-timeout=5s
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}
spring.rabbitmq.dynamic=false
spring.rabbitmq.template.retry.enabled=false

# Independent local HTTP credentials, NOT Azure credentials and NOT the broker password.
barriodigital.admin.username=${ADMIN_HTTP_USERNAME:}
barriodigital.admin.password=${ADMIN_HTTP_PASSWORD:}
